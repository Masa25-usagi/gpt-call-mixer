<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MVB Local Signal Meter</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --surface: #ffffff;
      --text: #1d1d1f;
      --text-muted: #62646c;
      --border: #d5d5da;
      --control-bg: #ffffff;
      --accent: #0a84ff;
      --accent-hover: #0066d6;
      --accent-contrast: #ffffff;
      --secondary-bg: #ececf0;
      --secondary-bg-hover: #e0e0e6;
      --status: #0071e3;
      --meter-track: #e2e2e6;
      --meter-from: #32d74b;
      --meter-mid: #ffd60a;
      --meter-to: #ff453a;
      --radius-lg: 16px;
      --radius-md: 10px;
      --space-1: 8px;
      --space-2: 12px;
      --space-3: 16px;
      --space-4: 24px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113;
        --surface: #1c1c1f;
        --text: #f2f2f5;
        --text-muted: #a9a9af;
        --border: #3f3f44;
        --control-bg: #2a2a2e;
        --accent: #0a84ff;
        --accent-hover: #409cff;
        --secondary-bg: #3a3a3f;
        --secondary-bg-hover: #48484e;
        --status: #8ecbff;
        --meter-track: #333338;
      }
    }

    * { box-sizing: border-box; }

    body {
      max-width: 760px;
      margin: 48px auto;
      padding: 0 20px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    section {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.06);
    }

    h1 { margin: 0 0 var(--space-2); font-size: 1.6rem; letter-spacing: -0.01em; }
    p { margin: 0; line-height: 1.6; color: var(--text-muted); }

    label {
      display: block;
      margin: var(--space-4) 0 var(--space-1);
      font-size: 0.9rem;
      font-weight: 600;
    }

    select, button { font: inherit; border-radius: var(--radius-md); }

    select {
      width: 100%;
      padding: 10px 12px;
      background: var(--control-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-1);
      margin-top: var(--space-3);
    }

    button {
      padding: 10px 16px;
      border: 1px solid transparent;
      background: var(--accent);
      color: var(--accent-contrast);
      cursor: pointer;
      font-weight: 600;
      transition: background 140ms ease, transform 80ms ease;
    }

    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }

    button.secondary {
      background: var(--secondary-bg);
      color: var(--text);
      border-color: var(--border);
    }

    button.secondary:hover { background: var(--secondary-bg-hover); }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .track {
      height: 26px;
      margin-top: var(--space-4);
      border-radius: 999px;
      background: var(--meter-track);
      overflow: hidden;
    }

    .level {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--meter-from), var(--meter-mid), var(--meter-to));
      transition: width 60ms linear;
    }

    .numbers {
      margin-top: var(--space-2);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .status {
      min-height: 24px;
      margin-top: var(--space-2);
      color: var(--status);
    }

    @media (max-width: 560px) {
      body { margin: 24px auto; }
      section { padding: 20px; }
      .numbers { font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .level, button { transition: none; }
    }
  </style>
</head>
<body>
  <section>
    <h1>MVB Local Signal Meter</h1>
    <p>入力の瞬間ピークだけをブラウザ内で計算します。録音、保存、アップロード、スピーカーへの再出力は行いません。</p>

    <label for="device">入力デバイス</label>
    <select id="device"></select>

    <div class="actions">
      <button id="reveal" class="secondary">デバイス名を表示・更新</button>
      <button id="start">計測開始</button>
      <button id="stop" class="secondary">停止</button>
    </div>

    <div class="track" aria-label="入力レベル"><div class="level" id="level"></div></div>
    <div class="numbers">現在 <span id="current">0.000000</span> / 最大 <span id="peak">0.000000</span></div>
    <div class="status" id="status">待機中</div>
  </section>

  <script>
    const deviceSelect = document.querySelector('#device');
    const currentNode = document.querySelector('#current');
    const peakNode = document.querySelector('#peak');
    const levelNode = document.querySelector('#level');
    const statusNode = document.querySelector('#status');
    let stream;
    let audioContext;
    let animationFrame;
    let maximum = 0;

    async function enumerate() {
      const devices = (await navigator.mediaDevices.enumerateDevices())
        .filter(device => device.kind === 'audioinput');
      deviceSelect.replaceChildren();
      for (const [index, device] of devices.entries()) {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.textContent = device.label || `入力 ${index + 1}`;
        deviceSelect.append(option);
      }
      const preferred = [...deviceSelect.options]
        .find(option => option.textContent.includes('MVB Meet'));
      if (preferred) {
        deviceSelect.value = preferred.value;
        statusNode.textContent = `選択済み: ${preferred.textContent}`;
      } else {
        statusNode.textContent = 'MVB Meet → ChatGPTが見えない場合は、ヘルパーの開始状態を確認してください。';
      }
    }

    async function revealLabels() {
      statusNode.textContent = 'Chromeのマイク許可を確認中…';
      const temporary = await navigator.mediaDevices.getUserMedia({audio: true});
      temporary.getTracks().forEach(track => track.stop());
      await enumerate();
    }

    async function startMeter() {
      stopMeter();
      maximum = 0;
      const deviceId = deviceSelect.value;
      if (!deviceId) throw new Error('入力デバイスがありません');
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          deviceId: {exact: deviceId},
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });
      audioContext = new AudioContext();
      const source = audioContext.createMediaStreamSource(stream);
      const analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      const samples = new Float32Array(analyser.fftSize);
      statusNode.textContent = `計測中: ${deviceSelect.selectedOptions[0].textContent}`;

      const update = () => {
        analyser.getFloatTimeDomainData(samples);
        let peak = 0;
        for (const sample of samples) peak = Math.max(peak, Math.abs(sample));
        maximum = Math.max(maximum, peak);
        currentNode.textContent = peak.toFixed(6);
        peakNode.textContent = maximum.toFixed(6);
        levelNode.style.width = `${Math.min(100, peak * 250)}%`;
        animationFrame = requestAnimationFrame(update);
      };
      update();
    }

    function stopMeter() {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      if (stream) stream.getTracks().forEach(track => track.stop());
      if (audioContext) audioContext.close();
      animationFrame = stream = audioContext = undefined;
      statusNode.textContent = '停止しました';
    }

    document.querySelector('#reveal').addEventListener('click', () => revealLabels().catch(showError));
    document.querySelector('#start').addEventListener('click', () => startMeter().catch(showError));
    document.querySelector('#stop').addEventListener('click', stopMeter);
    function showError(error) { statusNode.textContent = `エラー: ${error.message}`; }
    enumerate().catch(showError);
  </script>
</body>
</html>
